<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Journey So Far</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin:0;
      font-family:'Poppins', sans-serif;
      background: linear-gradient(to bottom,#ffdde1,#ee9ca7);
      color:#333;
      overflow-x:hidden;
    }
    header {
      text-align:center;
      padding:120px 20px;
      background: linear-gradient(135deg,#ff9a9e,#fad0c4);
      color:white;
      position:relative;
      overflow:hidden;
    }
    header h1 {
      font-family:'Great Vibes', cursive;
      font-size:4em;
      text-shadow:0 0 20px pink;
      animation: glow 3s infinite alternate;
    }
    header p {
      font-size:1.5em;
      margin-top:20px;
      animation: fadeIn 5s ease-in-out;
    }
    .chapter {
      margin:80px auto;
      padding:40px;
      width:85%;
      background:white;
      border-radius:20px;
      box-shadow:0 0 30px rgba(255,100,150,0.3);
      animation: slideUp 2s;
      position:relative;
    }
    .chapter h2 {
      font-family:'Great Vibes', cursive;
      font-size:2.5em;
      color:#d6336c;
    }
    .chapter img {
      margin:15px;
      border-radius:15px;
      box-shadow:0 0 15px rgba(0,0,0,0.2);
      width:200px;
      transition:transform 0.5s;
      animation: fadeIn 2s ease-in-out;
    }
    .chapter img:hover { transform:scale(1.1); }
    .postit {
      position:absolute;
      right:-70px;
      top:40px;
      width:160px;
      background:#fff8b3;
      padding:12px;
      font-style:italic;
      transform:rotate(-5deg);
      box-shadow:0 5px 15px rgba(0,0,0,0.2);
      animation: float 4s infinite ease-in-out;
    }
    .flower {
      font-size:3em;
      cursor:pointer;
      transition:0.5s;
      display:inline-block;
      margin:20px;
      animation: sway 3s infinite ease-in-out;
    }
    .flower:hover { transform:scale(1.4) rotate(10deg); color:pink; text-shadow:0 0 20px hotpink; }
    .note { display:none; font-style:italic; margin-top:10px; color:#d6336c; font-size:1.2em; animation:typewriter 2s steps(20) 1 normal both; }
    .finale {
      background:url('rosebg.jpg') no-repeat center/cover;
      padding:150px 20px;
      text-align:center;
      color:white;
      position:relative;
      overflow:hidden;
    }
    .finale h2 {
      font-family:'Great Vibes', cursive;
      font-size:3em;
      animation: glow 3s infinite alternate;
    }
    .finale p {
      font-size:1.5em;
      margin-top:20px;
      animation: typewriter 6s steps(40) 1 normal both;
    }
    .sparkle {
      position:absolute;
      width:8px; height:8px;
      background:white;
      border-radius:50%;
      animation: sparkle 5s infinite;
    }
    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
